<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent HQ</title>
<style>
@font-face{font-family:"Barlow";src:url(/fonts/barlow-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Barlow";src:url(/fonts/barlow-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Barlow";src:url(/fonts/barlow-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Barlow SC";src:url(/fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Barlow SC";src:url(/fonts/barlow-semi-condensed-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Barlow SC";src:url(/fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2");font-weight:700}
:root,[data-theme=dark]{
  --bg:#0d1016; --bg2:#10141b; --panel:#151a23; --panel2:#1b212c; --panel3:#222936; --line:#262e3b; --line2:#323c4c;
  --text:#e9edf3; --muted:#8d97aa; --dim:#5f697b;
  --accent:#f08a4b; --accent-ink:#1d0e04; --green:#38c172; --amber:#f2b230; --red:#ef4b55; --blue:#5aa2f0; --teal:#4fd1c5;
  --lampoff:#3a4352; --bezel:#2b3340; --term:#090b10; --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme=light]{
  --bg:#cfd3cf; --bg2:#c4c9c4; --panel:#f7f7f4; --panel2:#eceee9; --panel3:#e2e5e0; --line:#d3d7d2; --line2:#b9bfba;
  --text:#1f2326; --muted:#545c61; --dim:#7d8589; --accent:#d9692b; --accent-ink:#fff;
  --lampoff:#a2a8a3; --bezel:#8e958f; --term:#1c2023; --shadow:0 10px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 "Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}

/* sidebar */
aside{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand .bav{width:40px;height:40px}
.brand b{font:700 20px/1 "Barlow SC";letter-spacing:.2px;display:block}
.brand small{color:var(--dim);font-size:12px}
nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:9px 11px;border-radius:9px;color:var(--muted);text-align:left;margin-bottom:2px;font-weight:500}
nav button svg{flex:none;opacity:.8}
nav button:hover{background:var(--panel);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
nav .badge{margin-left:auto;background:var(--amber);color:#231700;font:700 12px "Barlow SC";border-radius:99px;padding:1px 8px}
nav .badge:empty{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px 8px 2px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.side-foot .st{display:flex;align-items:center;gap:9px}
.side-foot button{all:unset;cursor:pointer;color:var(--dim);font-size:13px;margin-top:4px}
.side-foot button:hover{color:var(--red)}

/* lamps */
.lamp{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--lampoff);box-shadow:inset 0 -1px 2px rgba(0,0,0,.35),0 0 0 1.5px var(--bezel)}
.lamp.g{background:radial-gradient(circle at 35% 32%,#b8f5cb,var(--green) 62%);box-shadow:0 0 0 1.5px var(--bezel),0 0 8px rgba(56,193,114,.7)}
.lamp.a{background:radial-gradient(circle at 35% 32%,#ffe7a6,var(--amber) 62%);box-shadow:0 0 0 1.5px var(--bezel),0 0 8px rgba(242,178,48,.75)}
.lamp.r{background:radial-gradient(circle at 35% 32%,#ffb3b8,var(--red) 62%);box-shadow:0 0 0 1.5px var(--bezel),0 0 8px rgba(239,75,85,.7)}
.lamp.b{background:radial-gradient(circle at 35% 32%,#d2e8ff,var(--blue) 62%);box-shadow:0 0 0 1.5px var(--bezel),0 0 7px rgba(90,162,240,.6)}
.lamp.w{background:radial-gradient(circle at 35% 32%,#fff,#dfe7e4 70%);box-shadow:0 0 0 1.5px var(--bezel)}
.lamp.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{background:var(--lampoff);box-shadow:0 0 0 1.5px var(--bezel)}}

/* usage bar */
main{overflow:auto;min-width:0}
.usage{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.usage .lbl{font-weight:600;white-space:nowrap}
.bargraph{display:flex;gap:3px;align-items:center}
.bargraph i{width:8px;height:15px;border-radius:2px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.bargraph i.on{box-shadow:0 0 6px -1px currentColor}
.bargraph.boot i.on{animation:segon .45s backwards}
@keyframes segon{from{opacity:.1}}
.usage .val{font:600 17px "Barlow SC";white-space:nowrap}
.usage .val small{font:500 14px "Barlow";color:var(--muted)}
.usage .sub{color:var(--muted);font-size:14px;white-space:nowrap}
.usage .sub b{color:var(--text);font-weight:600}
.reset{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);padding:3px 11px;border-radius:99px}

.page{padding:22px 26px 36px;max-width:1700px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font:700 28px/1.1 "Barlow SC";margin:0}
.head .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line2);padding:7px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--text);border-color:var(--line2)}
.btn.danger:hover{color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;position:relative}
.stat .l{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.stat .n{font:700 28px/1.15 "Barlow SC";margin-top:2px}
.stat .n small{font:500 15px "Barlow";color:var(--muted)}
.stat.alert{border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 10%,var(--panel)),var(--panel))}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.card>header{display:flex;align-items:center;gap:10px;padding:13px 16px 0}
.card>header h2{margin:0;font:600 19px "Barlow SC"}
.card>header .r{margin-left:auto;color:var(--muted);font-size:14px}
.card .body{padding:12px 16px 16px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ---------- robot mascot (the avatar of every agent) ---------- */
.bav{--c:#f08a4b;position:relative;width:50px;height:50px;border-radius:13px;flex:none;background:color-mix(in srgb,var(--c) 16%,var(--panel2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent);overflow:visible}
.bav svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bav .rb{transform-origin:20px 34px}
.bav .ant{fill:var(--lampoff)}
.bav .arm{transform-box:view-box;transform-origin:28.5px 29px}
.bav .eyes{transform-box:fill-box;transform-origin:center;animation:eyeblink 4.8s infinite}
.bav .e-happy,.bav .e-x,.bav .e-sleep{display:none}
.bav .bub,.bav .zz,.bav .sp,.bav .puff{position:absolute;pointer-events:none;opacity:0}
.bav .bub{right:-9px;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#2a1b00;font:700 14px/20px "Barlow SC";text-align:center;box-shadow:0 0 0 2px var(--panel)}
.bav .zz{right:-2px;top:-6px;font:700 13px "Barlow SC";color:var(--muted)}
.bav .sp{width:3px;height:3px;border-radius:50%;background:#ffd25a;box-shadow:0 0 5px #ffb100;left:80%;top:62%}
.bav .puff{width:9px;height:9px;border-radius:50%;background:rgba(150,156,165,.6);left:40%;top:8%}
@keyframes eyeblink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* running: hammering */
.bav.s-running .ant{fill:var(--green);filter:drop-shadow(0 0 2.5px var(--green))}
.bav.s-running .arm{animation:hammer .3s ease-in infinite alternate}
.bav.s-running .rb{animation:bob .3s ease-in-out infinite alternate}
.bav.s-running .sp{animation:spark .6s ease-out infinite}
.bav.s-running .sp.s2{animation-delay:.2s}.bav.s-running .sp.s3{animation-delay:.4s}
@keyframes hammer{from{transform:rotate(-55deg)}to{transform:rotate(12deg)}}
@keyframes bob{to{transform:translateY(-.8px)}}
@keyframes spark{0%{opacity:1;translate:0 0}100%{opacity:0;translate:var(--dx,8px) var(--dy,-10px)}}
.bav .sp.s2{--dx:12px;--dy:-3px}.bav .sp.s3{--dx:4px;--dy:-13px}
/* queued: looking around */
.bav.s-queued .ant{fill:var(--blue);filter:drop-shadow(0 0 2px var(--blue))}
.bav.s-queued .eyes{animation:look 2.4s ease-in-out infinite}
@keyframes look{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
/* waiting on you: hand up + question */
.bav.s-waiting .ant{fill:var(--amber);animation:antb 1.1s steps(1) infinite}
@keyframes antb{50%{fill:var(--lampoff)}}
.bav.s-waiting .arm{transform:rotate(-150deg);animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-165deg)}to{transform:rotate(-130deg)}}
.bav.s-waiting .bub{opacity:1;animation:float 1.2s ease-in-out infinite alternate}
@keyframes float{to{translate:0 -3px}}
/* paused: asleep */
.bav.s-paused .eyes{display:none}.bav.s-paused .e-sleep{display:inline}
.bav.s-paused .rb{animation:breathe 3s ease-in-out infinite}
.bav.s-paused .zz{animation:zz 2.4s ease-out infinite}
@keyframes breathe{50%{transform:translateY(.8px)}}
@keyframes zz{0%{opacity:0;translate:0 4px}20%{opacity:1}100%{opacity:0;translate:8px -12px;scale:1.4}}
/* error: smoke and shaking */
.bav.s-error .ant{fill:var(--red);filter:drop-shadow(0 0 3px var(--red))}
.bav.s-error .eyes{display:none}.bav.s-error .e-x{display:inline}
.bav.s-error .rb{animation:shake .35s steps(2) infinite}
.bav.s-error .puff{animation:puff 1.8s ease-out infinite}
@keyframes shake{50%{transform:translateX(.8px)}}
@keyframes puff{0%{opacity:.9;scale:.6}100%{opacity:0;translate:4px -16px;scale:2.2}}
/* done: happy */
.bav.s-done .ant{fill:#fff}
.bav.s-done .eyes{display:none}.bav.s-done .e-happy{display:inline}
.bav.s-done .rb{animation:hop 4s ease-out infinite}
@keyframes hop{0%,82%,100%{transform:none}88%{transform:translateY(-4px)}}
.bav.s-stopped{filter:grayscale(1);opacity:.55}
.bav.s-stopped .eyes{animation:none;opacity:.25}
.bav.s-idle .eyes{animation:eyeblink 4.8s infinite,look 6s ease-in-out infinite}
.bav.hop .rb{animation:hop1 .5s ease-out}
@keyframes hop1{40%{transform:translateY(-6px)}}
.bav.wave .arm{animation:wave .6s ease-in-out infinite alternate;transform:rotate(-150deg)}
.env{position:fixed;z-index:50;pointer-events:none;width:20px;height:14px}

/* agent cards */
.mission-h{display:flex;align-items:baseline;gap:12px;margin:16px 0 9px}
.mission-h:first-child{margin-top:2px}
.mission-h b{font:600 16px "Barlow SC";min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mission-h .ln{flex:1;height:1px;background:var(--line)}
.mission-h span{color:var(--dim);font-size:13px;white-space:nowrap}
.tree{display:flex;flex-direction:column;gap:8px}
.node{position:relative}
.node.child{margin-left:calc(var(--d) * 30px)}
.node.child::before{content:"";position:absolute;left:-17px;top:-10px;height:42px;width:13px;border-left:2px solid var(--line2);border-bottom:2px solid var(--line2);border-bottom-left-radius:9px}
.agent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--dim);border-radius:12px;padding:9px 12px;cursor:pointer;transition:background .15s}
.agent:hover{background:var(--panel3)}
.agent.s-running{border-left-color:var(--green)}
.agent.s-waiting{border-left-color:var(--amber);background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 9%,var(--panel2)),var(--panel2) 45%)}
.agent.s-queued{border-left-color:var(--blue)}.agent.s-done{border-left-color:var(--teal)}
.agent.s-error{border-left-color:var(--red);background:linear-gradient(90deg,color-mix(in srgb,var(--red) 9%,var(--panel2)),var(--panel2) 45%)}
.agent.s-stopped{opacity:.6}
.agent.enter{animation:enter .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes enter{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.agent.flash{animation:flash 1.3s ease-out}
@keyframes flash{from{box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 60%,transparent)}}
.a-top{display:flex;align-items:center;gap:8px;min-width:0}
.a-name{font:600 16px "Barlow SC"}
.a-role{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-act{color:var(--text);opacity:.85;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.a-meta{display:flex;gap:16px;color:var(--dim);font-size:13px;margin-top:2px;flex-wrap:wrap}
.a-meta b{color:var(--muted);font-weight:500}
.tag{display:inline-flex;font:700 12px "Barlow SC";border:1px solid var(--line2);border-radius:5px;overflow:hidden;white-space:nowrap;background:var(--panel)}
.tag i{width:4px}
.tag span{padding:0 6px}
.pill{font:600 12px "Barlow SC";padding:1px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.2px}
.p-running{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.p-waiting{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.p-queued{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.p-paused,.p-idle{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.p-done{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.p-stopped{background:color-mix(in srgb,var(--dim) 18%,transparent);color:var(--dim)}
.p-error{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:0 6px}
.ctl{display:flex;gap:7px}
.pb{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel);box-shadow:0 0 0 1.5px var(--line2)}
.pb .cap{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.pb.go .cap{background:var(--green)}.pb.hold .cap{background:#6b7484}.pb.halt .cap{background:var(--red)}.pb.bin .cap{background:#6b7484}
.pb:hover .cap{filter:brightness(1.15)}
.pb:active .cap{transform:translateY(1px)}
.pb:focus-visible{box-shadow:0 0 0 2px var(--accent)}

/* decisions */
.dec{border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 8%,var(--panel2)),var(--panel2));border-radius:12px;padding:12px;margin-bottom:10px}
.dec.perm{border-color:color-mix(in srgb,var(--blue) 45%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 8%,var(--panel2)),var(--panel2))}
.dec.enter{animation:enter .45s cubic-bezier(.2,1.3,.4,1)}
.dec .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dec .who .bav{width:36px;height:36px;border-radius:10px}
.dec .who b{font:600 15px "Barlow SC"}
.dec .who small{display:block;color:var(--muted);font-size:12.5px}
.dec .who .r{margin-left:auto;color:var(--dim);font-size:13px;align-self:flex-start}
.dec .q{font-weight:600;font-size:15.5px;margin-bottom:6px}
.dec .d{font-size:14px;color:var(--muted);margin-bottom:9px}
.dec .code{font:13px/1.45 "Cascadia Mono",Consolas,monospace;background:var(--term);color:#cfe3d2;padding:8px 10px;border-radius:8px;margin-bottom:9px;white-space:pre-wrap;word-break:break-all}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.opt{background:var(--panel3);border:1px solid var(--line2);padding:5px 13px;border-radius:9px;font-weight:600}
.opt:hover{border-color:var(--amber);color:var(--amber)}
.opt.allow:hover{border-color:var(--green);color:var(--green)}.opt.deny:hover{border-color:var(--red);color:var(--red)}
.own{display:flex;gap:6px}
.field,select.field,textarea.field{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;outline:none}
[data-theme=light] .field{background:#fff}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:120px;resize:vertical;line-height:1.5}
.quiet{color:var(--muted);font-size:14px}
.calm{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;padding:4px 0}
.calm .bav{width:38px;height:38px;border-radius:10px}

/* feed */
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:99px;overflow:hidden;margin-left:auto}
.seg button{all:unset;cursor:pointer;padding:1px 10px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel3);color:var(--text)}
.feed{max-height:430px;overflow:auto;padding:4px 16px 12px}
.ev{display:grid;grid-template-columns:40px 14px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:14px}
.ev:last-child{border:0}
.ev time{color:var(--dim);font-size:12.5px}
.ev.info .tx,.ev.chatter .tx{color:var(--muted)}
.ev.critical .tx{color:var(--red)}
.ev.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{from{background:color-mix(in srgb,var(--amber) 18%,transparent)}}

/* terminal */
.term{margin-top:18px;background:var(--term);border:1px solid var(--line);border-radius:14px;overflow:hidden;font:13.5px/1.5 "Cascadia Mono","Cascadia Code",Consolas,monospace;color:#cfe3d2}
.term header{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid #1f2630;font-family:"Barlow";color:#e9edf3}
.term header b{font:600 16px "Barlow SC"}
.term header span{color:#6b788c;font-size:13px}
.term-out{height:190px;overflow:auto;padding:10px 14px;white-space:pre-wrap;word-break:break-word}
.term-out .ti{color:#fff}.term-out .ti::before{content:"hq › ";color:var(--accent)}
.term-out .to{color:#7f90a6;margin-bottom:6px}
.term-out .ta{color:#e9edf3;border-left:2px solid var(--accent);padding-left:10px;margin:2px 0 8px}
.term-in{display:flex;gap:8px;padding:9px 14px;border-top:1px solid #1f2630}
.term-in label{color:var(--accent);font-weight:700}
.term-in input{flex:1;background:none;border:0;outline:none;color:#fff;font:inherit}
.term-in input::placeholder{color:#4c5869}

/* drawer */
.drawer{position:fixed;inset:0 0 0 auto;width:min(580px,100vw);background:var(--bg2);border-left:1px solid var(--line2);z-index:30;transform:translateX(102%);transition:transform .22s ease-out;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.4)}
.drawer.show{transform:none}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.dh .bav{width:64px;height:64px;border-radius:16px}
.dh h2{margin:0;font:700 23px "Barlow SC"}
.dh .meta{color:var(--muted);font-size:14px}
.db{flex:1;overflow:auto;padding:16px 18px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.facts b{display:block;font:600 19px "Barlow SC"}
.facts span{color:var(--muted);font-size:13px}
.dsec{font:600 16px "Barlow SC";margin:14px 0 6px}
.mission{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.lg{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:14px;white-space:pre-wrap;word-break:break-word}
.lg time{color:var(--dim);font-size:12.5px;padding-top:1px}
.lg.tool .x{font:13px "Cascadia Mono",Consolas,monospace;color:var(--muted)}
.lg.in .x{color:var(--amber)}.lg.error .x{color:var(--red)}.lg.result .x{color:var(--teal);font-weight:600}.lg.info .x{color:var(--dim)}
.md{white-space:normal}.md p{margin:0 0 6px}.md ul{margin:2px 0 6px;padding-left:18px}.md pre{background:var(--term);color:#cfe3d2;padding:8px 10px;border-radius:8px;overflow:auto;font:12.5px/1.45 'Cascadia Mono',Consolas,monospace;margin:4px 0 8px;white-space:pre}.md code{font:12.5px 'Cascadia Mono',Consolas,monospace;background:var(--panel3);padding:0 4px;border-radius:4px}.md pre code{background:none;padding:0}.md h4{margin:6px 0 4px;font:600 15px 'Barlow SC'}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.df input{flex:1}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,6,9,.6);display:none;place-items:center;z-index:40;backdrop-filter:blur(4px)}
.scrim.show{display:grid}
.modal{width:min(640px,94vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:24px 26px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 4px;font:700 24px "Barlow SC"}
.modal p.lead{margin:0 0 6px;color:var(--muted)}
.modal .hero{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.modal .hero .bav{width:56px;height:56px;border-radius:15px}
label.l{display:block;font-weight:600;margin:14px 0 5px}
label.l small{font-weight:400;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:22px}
.actions .sp{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;cursor:pointer;background:var(--bg)}
[data-theme=light] .radio label{background:#fff}
.radio label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.radio input{margin-top:4px;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:13.5px}
.hint{color:var(--muted);font-size:13.5px}
.ok{color:var(--green)}.bad{color:var(--red)}
.progress{display:flex;gap:5px;margin-bottom:18px}
.progress i{flex:1;height:4px;border-radius:9px;background:var(--line2)}
.progress i.on{background:var(--accent)}
.langpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.langpick button{border:1px solid var(--line2);background:var(--bg);border-radius:12px;padding:18px;font:600 20px "Barlow SC";text-align:left}
.langpick button small{display:block;font:400 14px "Barlow";color:var(--muted)}
.langpick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}


/* connectors */
.section-t{font:600 21px "Barlow SC";margin:26px 0 3px}
.section-t:first-child{margin-top:2px}
.section-d{color:var(--muted);margin:0 0 12px;max-width:75ch}
.ctable{width:100%;border-collapse:collapse}
.ctable td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.ctable tr:last-child td{border-bottom:0}
.ctable .nm{font:600 16px "Barlow SC"}
.ctable .tg{color:var(--muted);font-size:13.5px;max-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctable .err{color:var(--red);font-size:13.5px}
.switch{position:relative;width:40px;height:23px;border-radius:12px;background:var(--line2);border:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--green)}.switch.on::after{left:20px}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.catalog button{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.catalog button:hover{border-color:var(--accent)}
.catalog b{font:600 17px "Barlow SC"}
.catalog span{color:var(--muted);font-size:14px}
.catalog small{color:var(--dim);font-size:12.5px;margin-top:4px}
.tg-form{padding:4px 16px 16px;border-top:1px solid var(--line)}
.tg-form ol{margin:10px 0;padding-left:20px;color:var(--muted)}
.kv-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}

/* external */
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.kan h4{margin:0 0 6px;font:600 15px "Barlow SC";color:var(--muted)}
.kt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:6px;font-size:14px}
.banner{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--amber) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);margin-bottom:16px}
.empty{display:flex;gap:18px;align-items:center;padding:26px 6px}
.empty .bav{width:76px;height:76px;border-radius:20px}
.empty h3{font:700 22px "Barlow SC";margin:0 0 4px}
.empty p{color:var(--muted);margin:0 0 12px;max-width:52ch}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line2);padding:9px 16px;border-radius:10px;display:none;z-index:60;box-shadow:var(--shadow)}
.view{display:none}.view.on{display:block}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1280px){.grid{grid-template-columns:1fr}.setgrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="bav s-idle" id="brandBot" style="--c:#f08a4b"></div><div><b>Agent HQ</b><small id="ver"></small></div></div>
  <nav>
    <button data-view="command" class="on"><svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="10" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="10" width="6" height="6" rx="1.5"/><rect x="10" y="10" width="6" height="6" rx="1.5"/></svg><span data-i="nav_command"></span></button>
    <button data-view="decisions"><svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2 L16.5 15.5 H1.5 Z" stroke-linejoin="round"/><path d="M9 7v4M9 13v.5" stroke-linecap="round"/></svg><span data-i="nav_decisions"></span><span class="badge" id="navBadge"></span></button>
    <button data-view="connectors"><svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 2v4M12 2v4M4 6h10v3a5 5 0 0 1-10 0z M9 14v2.5"/></svg><span data-i="nav_connectors"></span></button>
    <button data-view="claude"><svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.5" y="3" width="15" height="11" rx="2"/><path d="M5 7l2 2-2 2M9.5 11H13"/></svg><span data-i="nav_claude"></span></button>
    <button data-view="settings"><svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h12M3 9h12M3 13h12"/><circle cx="6" cy="5" r="1.6" fill="var(--bg2)"/><circle cx="12" cy="9" r="1.6" fill="var(--bg2)"/><circle cx="8" cy="13" r="1.6" fill="var(--bg2)"/></svg><span data-i="nav_settings"></span></button>
  </nav>
  <div class="side-foot"><div class="st" id="stClaude"></div><div class="st" id="stTg"></div><div class="st" id="stLive"></div><button onclick="quitApp()" data-i="quit"></button></div>
</aside>

<main>
  <div class="usage" id="usage"></div>
  <div class="page">
  <section class="view on" id="v-command">
    <div class="head"><h1 data-i="nav_command"></h1><div class="sp"></div>
      <button class="btn quiet" onclick="cmd('pause all')" data-i="pause_all"></button>
      <button class="btn quiet danger" onclick="if(confirm(t('confirm_stop_all')))cmd('stop all')" data-i="stop_all"></button>
      <button class="btn primary" onclick="openMission()" data-i="new_mission"></button></div>
    <div class="stats" id="stats"></div>
    <div class="grid">
      <div class="card"><header><h2 data-i="agents"></h2><span class="r" id="netNote"></span><button class="btn quiet sm" id="clearBtn" onclick="clearDone()" data-i="clear_done" style="display:none"></button></header><div class="body" id="tree"></div></div>
      <div class="col">
        <div class="card"><header><h2 data-i="waiting_on_you"></h2></header><div class="body" id="decs"></div></div>
        <div class="card"><header><h2 data-i="log"></h2><div class="seg" id="seg"></div></header><div class="feed" id="feed"></div></div>
      </div>
    </div>
    <div class="term"><header><b data-i="terminal"></b><span data-i="term_hint"></span></header>
      <div class="term-out" id="termOut" aria-live="polite"></div>
      <div class="term-in"><label for="termIn">hq ›</label><input id="termIn" autocomplete="off" spellcheck="false"></div></div>
  </section>

  <section class="view" id="v-decisions">
    <div class="head"><h1 data-i="nav_decisions"></h1></div>
    <div class="grid"><div class="card"><header><h2 data-i="open_now"></h2></header><div class="body" id="decs2"></div></div>
      <div class="card"><header><h2 data-i="answered"></h2></header><div class="feed" id="decHist"></div></div></div>
  </section>

  <section class="view" id="v-connectors">
    <div class="head"><h1 data-i="nav_connectors"></h1></div>
    <p class="section-d" data-i="conn_intro"></p><div id="connPage"></div>
  </section>

  <section class="view" id="v-claude">
    <div class="head"><h1 data-i="nav_claude"></h1></div><p class="section-d" data-i="claude_intro"></p>
    <div id="extBanner"></div>
    <div class="grid"><div id="extTeams"></div>
      <div class="col"><div class="card"><header><h2 data-i="sessions"></h2></header><div class="feed" id="extSess"></div></div>
      <div class="card"><header><h2 data-i="team_msgs"></h2></header><div class="feed" id="extMsgs"></div></div></div></div>
  </section>

  <section class="view" id="v-settings">
    <div class="head"><h1 data-i="nav_settings"></h1><div class="sp"></div><button class="btn quiet" onclick="openWizard()" data-i="run_setup"></button><button class="btn primary" onclick="saveSettings()" data-i="save"></button></div>
    <div class="setgrid" id="settingsForm"></div>
  </section>
  </div>
</main>
</div>

<div class="drawer" id="drawer" role="dialog"><div class="dh" id="dh"></div><div class="db" id="db"></div>
  <div class="df"><input class="field" id="drMsg" autocomplete="off"><button class="btn primary" onclick="sendDrawerMsg()" data-i="send"></button></div></div>

<div class="scrim" id="missionModal"><div class="modal" role="dialog" aria-modal="true">
  <div class="hero"><div class="bav wave s-idle" id="mBot" style="--c:#f08a4b"></div><div><h2 data-i="new_mission"></h2><p class="lead" data-i="mission_lead"></p></div></div>
  <label class="l" for="mText" data-i="mission_q"></label><textarea class="field" id="mText"></textarea>
  <div class="two"><div><label class="l" for="mName" data-i="lead_name"></label><input class="field" id="mName"></div>
  <div><label class="l" for="mModel" data-i="model"></label><select class="field" id="mModel"><option value="" data-i="model_default"></option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select></div></div>
  <label class="l" for="mCwd"><span data-i="folder"></span> <small data-i="folder_hint"></small></label><input class="field" id="mCwd" spellcheck="false">
  <div id="mConns"></div>
  <div class="actions"><button class="btn quiet" onclick="hide('missionModal')" data-i="cancel"></button><button class="btn primary" onclick="launchMission()" data-i="start_mission"></button></div>
</div></div>
<div class="scrim" id="connModal"><div class="modal" role="dialog" aria-modal="true" id="connBody"></div></div>
<div class="scrim" id="wizard"><div class="modal" role="dialog" aria-modal="true" id="wizBody"></div></div>
<div class="toast" id="toast" role="status"></div>

/* envelopes fly between the robots in the agent list */
function flyMessages(){
  const evs=S.events||[];if(lastEv===null){lastEv=evs.length?evs[0].id:0;return}
  evs.filter(e=>e.id>lastEv).reverse().forEach(e=>{
    let toId=null;const m=e.text.match(/→ (\S+?):/);
    if(e.level==='chatter'&&m){const to=S.agents.find(a=>a.name===m[1]);toId=to&&to.id}
    else if(e.level==='info'){const ag=S.agents.find(a=>a.id===e.agentId);if(ag&&ag.parentId&&/:/.test(e.text))toId=ag.parentId}
    if(toId)setTimeout(()=>envelope(e.agentId,toId),80)});
  if(evs.length)lastEv=Math.max(lastEv,evs[0].id);
}
function envelope(fromId,toId){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||view!=='command')return;
  const A=document.querySelector(`#tree .bav[data-agent="${fromId}"]`),B=document.querySelector(`#tree .bav[data-agent="${toId}"]`);if(!A||!B)return;
  const a=A.getBoundingClientRect(),b=B.getBoundingClientRect();const n=document.createElement('div');n.className='env';
  n.innerHTML='<svg width="20" height="14" viewBox="0 0 20 14"><rect x=".8" y=".8" width="18.4" height="12.4" rx="2" fill="#fff" stroke="#1b1f26" stroke-width="1.4"/><path d="M1.6 2 L10 8 L18.4 2" fill="none" stroke="#1b1f26" stroke-width="1.4"/></svg>';
  document.body.appendChild(n);A.classList.add('wave');setTimeout(()=>A.classList.remove('wave'),700);
  const x0=a.left+a.width/2,y0=a.top+a.height/2,x1=b.left+b.width/2,y1=b.top+b.height/2,t0=performance.now(),D=900,arc=Math.min(90,40+Math.abs(y1-y0)*.25);
  (function step(now){const p=Math.min(1,(now-t0)/D),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    n.style.left=(x0+(x1-x0)*e+Math.sin(p*Math.PI)*arc-10)+'px';n.style.top=(y0+(y1-y0)*e-7)+'px';n.style.rotate=(Math.sin(p*Math.PI*2)*12).toFixed(1)+'deg';
    if(p<1)requestAnimationFrame(step);else{n.remove();B.classList.remove('hop');void B.offsetWidth;B.classList.add('hop');setTimeout(()=>B.classList.remove('hop'),600)}})(t0);
}

/* small markdown renderer for agent output (escaped first) */
function md(src){
  const parts=String(src).split(/```[\w-]*\n?/);let out='';
  parts.forEach((p,i)=>{if(i%2){out+=`<pre><code>${esc(p.replace(/\n$/,''))}</code></pre>`;return}
    let html='',list=false;
    esc(p).split('\n').forEach(line=>{
      let l=line.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
      const li=l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
      if(li){if(!list){html+='<ul>';list=true}html+=`<li>${li[1]}</li>`;return}
      if(list){html+='</ul>';list=false}
      const h=l.match(/^#{1,4}\s+(.*)/);if(h){html+=`<h4>${h[1]}</h4>`;return}
      if(l.trim())html+=`<p>${l}</p>`});
    if(list)html+='</ul>';out+=html});
  return out;
}

let notifSeen=null;

function notify(){
  if(!S||!('Notification' in window))return;const evs=S.events||[];
  if(notifSeen===null){notifSeen=evs.length?evs[0].id:0;return}
  evs.filter(e=>e.id>notifSeen&&(e.level==='decision'||e.level==='critical')).reverse().forEach(e=>{
    if(Notification.permission==='granted'&&document.hidden){const n=new Notification(e.level==='critical'?'Agent HQ — critical':'Agent HQ — decision needed',{body:e.text,tag:'hq-'+e.id});n.onclick=()=>{window.focus();go(e.level==='decision'?'decisions':'command');n.close()}}});
  if(evs.length)notifSeen=Math.max(notifSeen,evs[0].id);
}

function readKV(kind){const ks=[...document.querySelectorAll('.kvk-'+kind)],vs=[...document.querySelectorAll('.kvv-'+kind)];const o={};ks.forEach((k,i)=>{if(k.value.trim()||vs[i].value)o[k.value.trim()]=vs[i].value});return o}
function syncConn(){const e=editing;if($('cName'))e.name=$('cName').value;if($('cUrl')){e.url=$('cUrl').value.trim();e.headers=readKV('h')}if($('cCmd')){e.command=$('cCmd').value.trim();e.args=$('cArgs').value.split('\n').map(x=>x.trim()).filter(Boolean);e.env=readKV('e')}if($('cAsk'))e.approval=$('cAsk').checked;
  const p=e._p;if(p&&p.fields)p.fields.forEach((f,i)=>{const el=$('pf'+i);if(!el)return;const v=el.value.trim();if(f.target==='env'&&v)e.env[f.key]=v;if(f.target==='header'&&v)e.headers[f.key]=v.includes('••••')?v:(f.prefix||'')+v;if(f.target==='url'&&v)e.url=v;if(f.target==='arg'){const base=(p.args||[]).length;e.args=e.args.slice(0,base);if(v)e.args.push(v)}})}
async function saveConn(){syncConn();const e={...editing};delete e._p;try{const r=await api('/api/connectors/save',e);hide('connModal');toast(t('c_saved'));await loadConnectors();testConn(r.id)}catch(err){toast(err.message)}}
async function delConn(id){await api('/api/connectors/delete',{ID:id});hide('connModal');loadConnectors();refresh()}

/* settings */
function fld(id,label,val,type='text',extra=''){return `<label class="l" for="${id}">${label}</label><input class="field" id="${id}" type="${type}" value="${esc(val??'')}" ${extra}>`}
function permRadio(name,cur){return `<div class="radio">${[['ask','perm_ask'],['edits','perm_edits'],['full','perm_full']].map(([v,k])=>`<label><input type="radio" name="${name}" value="${v}" ${cur===v?'checked':''}><span><b>${t(k)}</b><small>${t(k+'_d')}</small></span></label>`).join('')}</div>`}
async function renderSettings(){const c=await api('/api/config');
  $('settingsForm').innerHTML=`<div class="card"><header><h2>${t('g_general')}</h2></header><div class="body">
    <div class="two"><div><label class="l" for="sLang">${t('language')}</label><select class="field" id="sLang"><option value="en" ${c.lang==='en'?'selected':''}>English</option><option value="nl" ${c.lang==='nl'?'selected':''}>Nederlands</option></select></div>
    <div><label class="l" for="sTheme">${t('theme')}</label><select class="field" id="sTheme"><option value="dark" ${c.theme!=='light'?'selected':''}>${t('dark')}</option><option value="light" ${c.theme==='light'?'selected':''}>${t('light')}</option></select></div></div>
    ${fld('sWs',t('workspace'),c.workspace)}<label class="check" style="margin-top:14px"><input type="checkbox" id="sAuto" ${S&&S.autostart?'checked':''} ${S&&S.canAutostart?'':'disabled'}><span>${t('autostart')}</span></label></div></div>
  <div class="card"><header><h2>${t('g_claude')}</h2></header><div class="body">${fld('sClaude',t('claude_path'),c.claudePath,'text',`placeholder="${t('auto_find')}"`)}
    <p class="hint" id="sClaudeRes">${S&&S.claudePath?t('found')+': '+esc(S.claudePath):''}</p><button class="btn sm" onclick="testClaude('sClaude','sClaudeRes')">${t('test')}</button>
    <label class="l" for="sModel">${t('model')}</label><select class="field" id="sModel">${['','opus','sonnet','haiku'].map(m=>`<option value="${m}" ${c.defaultModel===m?'selected':''}>${m?m[0].toUpperCase()+m.slice(1):t('model_default')}</option>`).join('')}</select></div></div>
  <div class="card"><header><h2>${t('g_agents')}</h2></header><div class="body"><label class="l">${t('perm')}</label>${permRadio('sPerm',c.permissionMode)}
    <div class="two"><div>${fld('sMaxA',t('max_agents'),c.maxAgents,'number','min=1 max=50')}</div><div>${fld('sMaxR',t('max_running'),c.maxRunning,'number','min=1 max=20')}</div></div>
    <div class="two"><div>${fld('sMaxD',t('max_depth'),c.maxDepth,'number','min=1 max=6')}</div><div>${fld('sMaxT',t('max_turns'),c.maxTurns,'number','min=1 max=500')}</div></div></div></div>
  <div class="card"><header><h2>${t('g_usage')}</h2></header><div class="body">${fld('sBudget',t('budget'),c.tokenBudget,'number','min=0 step=10000')}<p class="hint">${t('budget_d')}</p></div></div>`}
async function saveSettings(){const body={lang:$('sLang').value,theme:$('sTheme').value,workspace:$('sWs').value,claudePath:$('sClaude').value.trim(),defaultModel:$('sModel').value,permissionMode:(document.querySelector('input[name=sPerm]:checked')||{}).value,
  maxAgents:+$('sMaxA').value,maxRunning:+$('sMaxR').value,maxDepth:+$('sMaxD').value,maxTurns:+$('sMaxT').value,tokenBudget:+$('sBudget').value||0};
  try{await api('/api/config',body);if(S&&S.canAutostart&&$('sAuto').checked!==S.autostart)await api('/api/autostart',{Enabled:$('sAuto').checked});setTheme(body.theme);if(body.lang!==LANG){LANG=body.lang;applyI18n()}toast(t('saved'));refresh();renderSettings()}catch(e){toast(e.message)}}
async function testClaude(inp,out){$(out).textContent=t('testing');try{const r=await api('/api/claude/test',{Path:$(inp).value.trim()});$(out).innerHTML=`<span class="ok">${esc(r.version)}</span><br>${esc(r.path)}`}catch(e){$(out).innerHTML=`<span class="bad">${esc(e.message)}</span>`}}

/* setup */
let wz={};
async function openWizard(){const c=await api('/api/config');wz={step:0,lang:c.lang||LANG,claudePath:c.claudePath||'',workspace:c.workspace,perm:c.permissionMode,tok:c.botToken||''};show('wizard');renderWizard()}
function renderWizard(){const s=wz.step;const mood=['wave s-idle','s-queued','s-running','s-waiting','s-done'][s];
  let h=`<div class="progress">${[0,1,2,3,4].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div><div class="hero"><div class="bav ${mood}" style="--c:#f08a4b">${BOT}</div><div>`;
  if(s===0)h+=`<h2>${t('w_hello')}</h2><p class="lead">${t('w_lang')}</p></div></div><div class="langpick"><button class="${wz.lang==='en'?'on':''}" onclick="wzLang('en')">English<small>Interface, Telegram and agent reports</small></button><button class="${wz.lang==='nl'?'on':''}" onclick="wzLang('nl')">Nederlands<small>Interface, Telegram en rapporten van agents</small></button></div>`;
  if(s===1)h+=`<h2>${t('w_claude')}</h2><p class="lead">${t('w_claude_d')}</p></div></div><p id="wzRes">${S&&S.claudePath?`<span class="ok">${t('w_found')}</span> ${esc(S.claudePath)}`:`<span class="bad">${t('w_missing')}</span>`}</p>${fld('wzClaude',t('claude_path'),wz.claudePath,'text',`placeholder="${t('auto_find')}"`)}<p><button class="btn sm" onclick="testClaude('wzClaude','wzRes')">${t('test')}</button></p>`;
  if(s===2)h+=`<h2>${t('w_agents')}</h2></div></div>${permRadio('wzPerm',wz.perm)}${fld('wzWs',t('workspace'),wz.workspace)}`;
  if(s===3)h+=`<h2>${t('w_tg')}</h2><p class="lead">${t('w_tg_d')}</p></div></div><ol style="color:var(--muted);padding-left:20px">${t('tg_steps')}</ol>${fld('wzTok',t('bot_token'),wz.tok,'password','placeholder="123456:ABC-DEF…"')}`;
  if(s===4)h+=`<h2>${t('w_ready')}</h2><p class="lead">${t('w_ready_d')}</p></div></div>`;
  h+=`<div class="actions">${s>0?`<button class="btn quiet" onclick="wzMove(-1)">${t('back')}</button>`:''}<span class="sp"></span>${s===3?`<button class="btn quiet" onclick="$('wzTok').value='';wzMove(1)">${t('skip')}</button>`:''}<button class="btn primary" onclick="wzMove(1)">${s===4?t('finish'):t('next')}</button></div>`;
  $('wizBody').innerHTML=h}
function wzLang(l){wz.lang=l;LANG=l;applyI18n();renderWizard()}
async function wzMove(d){const s=wz.step;if(s===1)wz.claudePath=$('wzClaude').value.trim();
  if(s===2){wz.perm=(document.querySelector('input[name=wzPerm]:checked')||{}).value||'edits';wz.workspace=$('wzWs').value.trim()}if(s===3)wz.tok=$('wzTok').value.trim();
  if(s===4&&d>0){const body={lang:wz.lang,claudePath:wz.claudePath,permissionMode:wz.perm,workspace:wz.workspace,setupDone:true};if(wz.tok&&!wz.tok.includes('•'))body.botToken=wz.tok;await api('/api/config',body);hide('wizard');refresh();return}
  wz.step=Math.max(0,Math.min(4,s+d));renderWizard()}

applyI18n();
refresh().then(()=>{const m=location.hash.match(/agent=(\w+)/);if(m)openDrawer(m[1]);const v=location.hash.match(/view=(\w+)/);if(v)go(v[1]);const th=location.hash.match(/theme=(\w+)/);if(th)setTheme(th[1])});
setInterval(refresh,1500);
</script>
</body>
