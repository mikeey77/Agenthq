<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent HQ</title>
<link rel="icon" href="/assets/icon.png">
<style>
@font-face{font-family:"Inter";font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter";font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"JetBrains Mono";font-weight:100 800;font-display:swap;src:url(/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JetBrains Mono";font-weight:100 800;font-display:swap;src:url(/fonts/jetbrains-mono-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --a:255,138,76; --a2:255,196,96;
  --bg:#06070a; --bg2:#0b0d12; --b:9,11,15;
  --s1:rgba(255,255,255,.025); --s2:rgba(255,255,255,.045); --s3:rgba(255,255,255,.075);
  --edge:rgba(255,255,255,.075); --edge2:rgba(255,255,255,.13); --line:rgba(var(--a),.14); --line2:rgba(var(--a),.32);
  --txt:#e5e9f0; --hi:#fff; --dim:#8b94a5; --muted:#687183; --acc:rgb(var(--a)); --acc2:rgb(var(--a2));
  --ok:#3ddc84; --warn:#f5a524; --bad:#f2555a; --info:#4aa8ff; --teal:#3fd1c2;
  --ok-bg:rgba(61,220,132,.12); --warn-bg:rgba(245,165,36,.13); --bad-bg:rgba(242,85,90,.13); --info-bg:rgba(74,168,255,.13);
  --r1:8px; --r2:12px; --r3:16px;
  --sh1:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -18px rgba(0,0,0,.8);
  --sh2:0 1px 0 rgba(255,255,255,.05) inset,0 30px 70px -24px rgba(0,0,0,.85);
  --glow:0 0 20px rgba(var(--a),.3);
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --term:#05070a; color-scheme:dark;
}
[data-accent=green]{--a:61,255,160;--a2:182,255,74}
[data-accent=blue]{--a:77,184,255;--a2:150,120,255}
[data-accent=amber]{--a:255,184,77;--a2:255,110,64}
[data-accent=red]{--a:255,82,82;--a2:255,170,60}
[data-theme=light]{--bg:#eef0f3;--bg2:#e4e7ec;--b:255,255,255;--s1:rgba(0,0,0,.02);--s2:rgba(0,0,0,.035);--s3:rgba(0,0,0,.06);--edge:rgba(0,0,0,.09);--edge2:rgba(0,0,0,.16);--txt:#151922;--hi:#000;--dim:#555e6e;--muted:#737c8c;--sh1:0 1px 2px rgba(0,0,0,.06);--sh2:0 20px 50px -20px rgba(0,0,0,.25);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.5 var(--sans);font-feature-settings:"cv11","ss01","ss03";letter-spacing:-.003em;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:rgba(var(--a),.3)}
:focus-visible{outline:2px solid rgba(var(--a),.8);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(var(--a),.22);border-radius:10px;border:3px solid var(--bg)}
.mono,code,kbd,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1100px 700px at 92% -12%,rgba(var(--a2),.08),transparent 60%),radial-gradient(1000px 800px at -10% 110%,rgba(var(--a),.08),transparent 60%),linear-gradient(var(--bg),var(--bg2))}
#bg::before{content:"";position:absolute;inset:-50%;background-image:linear-gradient(rgba(var(--a),.045) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--a),.045) 1px,transparent 1px);background-size:52px 52px;transform:perspective(900px) rotateX(60deg) translateY(-8%);mask-image:linear-gradient(transparent 30%,#000 75%);-webkit-mask-image:linear-gradient(transparent 30%,#000 75%);animation:drift 34s linear infinite;opacity:.55}
@keyframes drift{to{background-position:0 52px,0 0}}
body:not([data-view=home]) #bg::before{opacity:.2}
[data-theme=light] #bg::before{opacity:.25}
#app{position:relative;z-index:1;display:grid;height:100%;grid-template-columns:76px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr) 28px;grid-template-areas:"rail top" "rail main" "foot foot"}
#rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-right:1px solid var(--line);background:rgba(var(--b),.72);backdrop-filter:blur(12px)}
.brand{width:46px;height:46px;border-radius:13px;margin-bottom:12px;border:1px solid var(--line2);box-shadow:var(--glow);background:rgba(var(--a),.08);cursor:pointer;position:relative}
.brand .bav{position:absolute;inset:0;width:100%;height:100%;background:none;box-shadow:none}
.tab{position:relative;width:58px;height:54px;border-radius:12px;border:1px solid transparent;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:color .15s,background .15s,border-color .15s}
.tab .ic{width:20px;height:20px}
.tab span{font:500 10px var(--sans);letter-spacing:.02em}
.tab:hover{color:var(--txt);background:var(--s2)}
.tab.on{color:var(--acc);background:rgba(var(--a),.09);border-color:var(--line2);box-shadow:var(--glow)}
.tab.on .ic{animation:tabPop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabPop{40%{transform:scale(1.2) rotate(-6deg)}}
.tab .badge{position:absolute;top:5px;right:7px;min-width:17px;height:17px;border-radius:9px;background:var(--warn);color:#1d1300;font:700 10px/17px var(--mono);padding:0 4px;text-align:center}
.tab .badge:empty{display:none}
.rail-sp{flex:1}
#top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(var(--b),.55);backdrop-filter:blur(12px)}
.title{font:700 13px var(--mono);letter-spacing:.24em;color:var(--acc);white-space:nowrap;text-shadow:0 0 14px rgba(var(--a),.45)}
.title small{font:500 12px var(--sans);letter-spacing:0;color:var(--muted);text-shadow:none;margin-left:8px}
.cmdbar{flex:1;max-width:620px;margin:0 auto;height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--edge2);background:rgba(0,0,0,.25);color:var(--muted);text-align:left;transition:border-color .15s,box-shadow .15s}
.cmdbar:hover{border-color:rgba(var(--a),.55);box-shadow:var(--glow);color:var(--dim)}
.cmdbar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:500 11px var(--mono);border:1px solid var(--edge2);border-radius:5px;padding:1px 6px;color:var(--dim);background:var(--s2)}
.mini-usage{display:flex;align-items:center;gap:9px;font:500 12px var(--mono);color:var(--dim);white-space:nowrap}
.mini-usage b{color:var(--txt);font-weight:600}
.bars{display:flex;gap:2px}
.bars i{width:5px;height:14px;border-radius:1.5px;background:var(--s3)}
#main{grid-area:main;overflow:auto;position:relative}
footer{grid-area:foot;display:flex;align-items:center;gap:22px;padding:0 18px;border-top:1px solid var(--line);background:rgba(var(--b),.8);font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden}
footer b{color:var(--txt);font-weight:500}
footer .r{margin-left:auto}
footer span{display:inline-flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(61,220,132,.7)}.dot.warn{background:var(--warn);box-shadow:0 0 8px rgba(245,165,36,.7)}
.dot.bad{background:var(--bad);box-shadow:0 0 8px rgba(242,85,90,.7)}.dot.info{background:var(--info);box-shadow:0 0 8px rgba(74,168,255,.6)}
.dot.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:.25}}
.btn{height:34px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;border-radius:var(--r1);border:1px solid var(--edge2);background:var(--s2);font:600 12.5px var(--sans);white-space:nowrap;transition:background .14s,border-color .14s,color .14s,filter .14s}
.btn:hover{background:var(--s3);border-color:rgba(var(--a),.55);color:var(--hi)}
.btn.pri{background:var(--acc);border-color:transparent;color:#140800}
.btn.pri:hover{filter:brightness(1.08);color:#140800;box-shadow:0 6px 22px -8px rgba(var(--a),.75)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--s2);color:var(--txt)}
.btn.danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}.btn.danger:hover{background:var(--bad);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.inp,select.inp,textarea.inp{width:100%;border-radius:var(--r1);background:rgba(0,0,0,.25);border:1px solid var(--edge2);padding:8px 11px;outline:none;font:14px var(--sans)}
[data-theme=light] .inp{background:#fff}
.inp:focus{border-color:rgba(var(--a),.7);box-shadow:0 0 0 3px rgba(var(--a),.18)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5}
.seg{display:inline-flex;border:1px solid var(--edge2);border-radius:var(--r1);background:rgba(0,0,0,.2);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:6px;padding:4px 12px;font:500 12.5px var(--sans);color:var(--dim)}
.seg button.on{background:var(--s3);color:var(--hi);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.seg.acc button.on{color:var(--acc)}
.switch{position:relative;width:38px;height:22px;border-radius:11px;background:var(--s3);border:1px solid var(--edge2);padding:0;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
.switch.on{background:rgba(var(--a),.25);border-color:rgba(var(--a),.6)}.switch.on::after{left:18px;background:var(--acc);box-shadow:0 0 8px rgba(var(--a),.8)}
.hud{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sec-t{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.sec-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sec-t .btn{text-transform:none;letter-spacing:0;order:2}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--sans);border:1px solid var(--edge2);border-radius:99px;padding:3px 11px;color:var(--dim);background:var(--s1)}
.chip .ic{width:13px;height:13px}
.chip.on{border-color:rgba(var(--a),.55);color:var(--acc);background:rgba(var(--a),.08)}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--sans);letter-spacing:.02em;border-radius:6px;padding:2px 7px;white-space:nowrap}
.badge .ic{width:11px;height:11px}
.b-running{background:var(--ok-bg);color:var(--ok)}.b-waiting{background:var(--warn-bg);color:var(--warn)}.b-queued{background:var(--info-bg);color:var(--info)}
.b-paused,.b-idle{background:var(--s3);color:var(--dim)}.b-done{background:rgba(63,209,194,.13);color:var(--teal)}.b-stopped{background:var(--s2);color:var(--muted)}.b-error{background:var(--bad-bg);color:var(--bad)}
.hint{color:var(--muted);font-size:12.5px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tag{display:inline-flex;font:600 10.5px var(--mono);border:1px solid var(--edge2);border-radius:5px;overflow:hidden;white-space:nowrap;color:var(--dim)}
.tag i{width:3px}.tag span{padding:0 5px}
.card{position:relative;border-radius:var(--r3);background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--edge);box-shadow:var(--sh1);backdrop-filter:blur(8px);min-width:0}
.card::before{content:"";position:absolute;inset:0 0 auto;height:2px;border-radius:var(--r3) var(--r3) 0 0;background:linear-gradient(90deg,var(--acc),transparent 70%);opacity:.75;pointer-events:none}
.card::after{content:"";position:absolute;inset:6px;pointer-events:none;opacity:.35;background:linear-gradient(var(--acc),var(--acc)) top left/11px 1px,linear-gradient(var(--acc),var(--acc)) top left/1px 11px,linear-gradient(var(--acc),var(--acc)) bottom right/11px 1px,linear-gradient(var(--acc),var(--acc)) bottom right/1px 11px;background-repeat:no-repeat}
.card>header{display:flex;align-items:center;gap:9px;padding:14px 16px 0;min-height:40px}
.card>header h3{margin:0;font:650 14.5px var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap}
.card>header h3 .ic{color:var(--acc)}
.card>header .r{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.card .body{padding:12px 16px 16px}
.empty-n{color:var(--muted);font-size:13px;padding:8px 0}
.view{display:none;padding:26px 30px 40px;max-width:1720px;margin:0 auto}
.view.on{display:block;animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.phead{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{margin:0;font:700 24px var(--sans);letter-spacing:-.02em}
.phead p{margin:2px 0 0;color:var(--dim)}
.phead .sp{flex:1}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;align-items:center;gap:20px;min-height:270px}
.hero .greet{font:600 11.5px var(--mono);letter-spacing:.22em;color:var(--acc);text-transform:uppercase}
.hero h1{margin:10px 0 8px;font:700 clamp(46px,6vw,76px)/1 var(--mono);letter-spacing:.14em;background:linear-gradient(180deg,#fff,rgba(var(--a),.9));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(var(--a),.35))}
[data-theme=light] .hero h1{background:linear-gradient(180deg,#222,rgb(var(--a)));-webkit-background-clip:text;background-clip:text}
.hero p{margin:0;color:var(--dim);font:500 13.5px/1.7 var(--sans);max-width:58ch}
.hero .line{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 22px;font:500 12px var(--mono);color:var(--muted)}
.hero .line b{color:var(--txt);font-weight:600}
.reactor{position:relative;width:290px;height:290px;margin-left:auto}
.reactor .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(var(--a),.28);animation:spin 80s linear infinite}
.reactor .ring.r2{inset:34px;border:1px solid rgba(var(--a),.16);box-shadow:inset 0 0 60px rgba(var(--a),.08),0 0 60px rgba(var(--a),.06);animation:none}
.reactor .ring.r3{inset:70px;border:1px solid rgba(var(--a),.1);animation:none}
.reactor .orbit{position:absolute;inset:0;animation:spin 18s linear infinite}
.reactor .orbit.o2{inset:34px;animation-duration:11s;animation-direction:reverse}
.reactor .orbit i{position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.reactor .orbit i.w{background:var(--warn);box-shadow:0 0 12px var(--warn)}
@keyframes spin{to{transform:rotate(360deg)}}
.reactor .core{position:absolute;inset:88px;border-radius:30px;background:rgba(var(--a),.08);border:1px solid var(--line2);box-shadow:var(--glow)}
.reactor .core .bav{position:absolute;inset:0;width:100%;height:100%;background:none;box-shadow:none}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
.w{grid-column:span var(--w,1);min-width:0}
.w.drag{opacity:.4}
.w.over{outline:2px dashed rgba(var(--a),.6);outline-offset:3px;border-radius:var(--r3)}
.wtools{display:none;gap:4px;margin-left:8px}
.editing .wtools{display:flex}
.editing .w{cursor:grab}
.editing .w .card{border-style:dashed;border-color:var(--line2)}
.wt{width:26px;height:24px;border-radius:6px;border:1px solid var(--edge2);background:var(--s2);display:grid;place-items:center;color:var(--dim);font:600 11px var(--mono);padding:0}
.wt .ic{width:12px;height:12px}
.wt:hover,.wt.on{color:var(--acc);border-color:rgba(var(--a),.55)}
.add-tile{grid-column:span 1;min-height:140px;border:1px dashed var(--line2);border-radius:var(--r3);background:rgba(var(--a),.04);color:var(--acc);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600}
.editing .add-tile{display:flex}
.add-tile:hover{background:rgba(var(--a),.09);box-shadow:var(--glow)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mod{padding:12px 14px;border-radius:var(--r2);background:var(--s1);border:1px solid var(--edge)}
.mod .k{font:500 12px var(--sans);color:var(--muted);display:flex;align-items:center;gap:7px}
.mod .big{font:600 26px var(--mono);letter-spacing:-.02em;color:var(--acc);margin:4px 0 0}
.mod .big small{font:500 13px var(--mono);color:var(--muted)}
.mod.alert{border-color:rgba(245,165,36,.45);background:var(--warn-bg)}
.mod.alert .big{color:var(--warn)}
.quick button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:8px 10px;border-radius:var(--r1);border:1px solid var(--edge);background:var(--s1);margin-bottom:6px;font-size:13px;color:var(--txt)}
.quick button:hover{border-color:rgba(var(--a),.55);background:rgba(var(--a),.07)}
.quick button .ic{color:var(--acc);width:13px;height:13px}
.quick button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick .x{display:none;flex:none!important;color:var(--muted)}.editing .quick .x{display:inline-flex}
.notes textarea{width:100%;min-height:150px;border:0;background:transparent;resize:vertical;outline:none;font:13.5px/1.6 var(--sans);color:var(--txt);padding:0}
.pin{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.pin .bav{width:84px;height:84px;border-radius:22px}
.pin b{font:650 16px var(--sans)}
.pin .act{font-size:12.5px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.pin .row{display:flex;gap:6px;width:100%}
.ubig{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ubig b{font:600 28px var(--mono);color:var(--acc)}
.ubig small{color:var(--muted);font:500 12px var(--mono)}
.ubar{height:8px;border-radius:6px;background:rgba(var(--a),.08);border:1px solid var(--line);overflow:hidden}
.ubar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px var(--acc);transition:width .6s}
.hist{display:flex;align-items:flex-end;gap:3px;height:46px;margin-top:12px}
.hist i{flex:1;background:rgba(var(--a),.25);border-radius:2px 2px 0 0;min-height:2px}
.hist i:last-child{background:var(--acc)}

.bav.s-running .tk{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
@keyframes tkpop{from{transform:scale(.3);opacity:0}}
.pin .bav .tk{width:28px;height:28px;border-radius:9px}.pin .bav .tk .ic{width:16px;height:16px}
.tchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:1px 7px 1px 5px;margin-right:6px;border-radius:6px;font:500 11.5px var(--mono);color:var(--hi);background:color-mix(in srgb,var(--c) 14%,transparent);vertical-align:1px}
.tchip .ic{width:12px;height:12px;color:var(--c)}
.kind{font:600 10.5px var(--sans);padding:1px 6px;border-radius:5px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:-6px 0 14px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
/* browser view */
.bwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;height:calc(100vh - 250px);min-height:420px}
.btabs{display:flex;flex-direction:column;gap:6px}
.btab{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r2);border:1px solid var(--edge);background:var(--s1);cursor:pointer;text-align:left;color:inherit;font:inherit;min-width:0}
.btab.on{border-color:rgba(var(--a),.6);background:rgba(var(--a),.07)}
.btab .bav{width:30px;height:30px;border-radius:9px}.btab .bav .tk{display:none}
.btab b{display:block;font-size:13px}.btab small{display:block;color:var(--dim);font:11px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btab>div{min-width:0}
.bview{display:flex;flex-direction:column;border:1px solid var(--edge);border-radius:var(--r3,14px);overflow:hidden;background:var(--s1)}
.bbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--edge)}
.bbar input{flex:1;height:32px;border-radius:8px;border:1px solid var(--edge);background:var(--s2);color:var(--hi);padding:0 12px;font:13px var(--mono);outline:none}
.bbar input:focus{border-color:rgba(var(--a),.7)}
.bscreen{position:relative;flex:1;min-height:0;background:#0b0d11;outline:none;display:grid;place-items:start center;overflow:hidden}
.bscreen img{max-height:100%;object-fit:contain;object-position:top}
.bscreen img{width:100%;height:auto;display:block;cursor:pointer;user-select:none}
.bscreen:focus-visible{box-shadow:inset 0 0 0 2px rgba(var(--a),.8)}
.bscreen .who{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:10px;background:rgba(10,12,16,.82);color:#fff;font-size:12px;backdrop-filter:blur(6px)}
.bscreen .who .bav{width:24px;height:24px;border-radius:7px}.bscreen .who .bav .tk{display:none}
.bscreen .kbd{position:absolute;right:12px;bottom:12px;padding:4px 9px;border-radius:8px;background:rgba(10,12,16,.8);color:#cfd6e2;font:11px var(--mono)}
.bempty{display:grid;place-items:center;text-align:center;color:var(--dim);padding:60px 20px}
.bempty .ic{width:42px;height:42px;color:rgba(var(--a),.8);margin-bottom:10px}
.bmini{position:relative;border-radius:var(--r2);overflow:hidden;background:#0b0d11;cursor:pointer;aspect-ratio:1280/860}
.bmini img{width:100%;display:block}
.bmini .who{position:absolute;left:8px;bottom:8px;padding:3px 8px;border-radius:7px;background:rgba(10,12,16,.82);color:#fff;font:11px var(--mono);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .live{position:absolute;top:8px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.tab{position:relative}
.limitpill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);font:600 12px var(--mono)}.limitpill .ic{width:13px;height:13px}
/* slash menu */
#slash{position:fixed;z-index:400;display:none;width:360px;max-height:320px;overflow:auto;padding:5px;border-radius:12px;background:rgb(var(--b));border:1px solid var(--edge2);box-shadow:0 16px 40px rgba(0,0,0,.45)}
#slash.show{display:block}
#slash .si{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13px}
#slash .si .ic{width:15px;height:15px;color:var(--dim)}
#slash .si code{font:600 12.5px var(--mono);color:var(--hi)}
#slash .si em{font-style:normal;color:var(--muted);font:11.5px var(--mono)}
#slash .si small{margin-left:auto;color:var(--dim);font-size:11.5px;text-align:right}
#slash .si.on{background:rgba(var(--a),.12)}#slash .si.on .ic{color:var(--acc)}
#slash .sh{font:600 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 9px 3px}
#slash .si .bav{width:20px;height:20px;border-radius:6px}#slash .si .bav .tk{display:none}
</style>

function readKV(kind){const ks=[...document.querySelectorAll('.kvk-'+kind)],vs=[...document.querySelectorAll('.kvv-'+kind)];const o={};ks.forEach((k,i)=>{if(k.value.trim()||vs[i].value)o[k.value.trim()]=vs[i].value});return o}

  const p=e._p;if(p&&p.fields)p.fields.forEach((f,i)=>{const el=$('pf'+i);if(!el)return;const v=el.value.trim();if(f.target==='env'&&v)e.env[f.key]=v;if(f.target==='header'&&v)e.headers[f.key]=v.includes('••••')?v:(f.prefix||'')+v;if(f.target==='url'&&v)e.url=v;if(f.target==='arg'){const base=(p.args||[]).length;e.args=e.args.slice(0,base);if(v)e.args.push(v)}})}

async function bOpen(v){if(!v.trim())return;if(!bSel)bSel='you';await bAct('open',{URL:v.trim()});$('bUrl').blur()}
function bClick(e){const r=e.target.getBoundingClientRect();$('bScreen').focus();bAct('click',{X:(e.clientX-r.left)/r.width,Y:(e.clientY-r.top)/r.height})}
$('bScreen').addEventListener('focus',()=>{const k=$('bScreen').querySelector('.kbd');if(k)k.style.display=''});
$('bScreen').addEventListener('blur',()=>{const k=$('bScreen').querySelector('.kbd');if(k)k.style.display='none'});
$('bScreen').addEventListener('keydown',e=>{if(!bSel||e.ctrlKey||e.metaKey)return;let key='',text='';
  if(['Enter','Backspace','Tab'].includes(e.key))key=e.key;else if(e.key.length===1)text=e.key;else return;e.preventDefault();api('/api/browser/act',{ID:bSel,Action:'key',Key:key,Text:text}).then(bShot).catch(()=>{})});
let bWheel=0;$('bScreen').addEventListener('wheel',e=>{if(!bSel)return;e.preventDefault();if(Date.now()-bWheel<180)return;bWheel=Date.now();const dy=Math.round(e.deltaY*2);api('/api/browser/act',{ID:bSel,Action:'scroll',Text:String(dy)}).then(bShot).catch(()=>{})},{passive:false});
setInterval(async()=>{await pollTabs();if(view==='browser'&&S){renderBrowser()}},1000);

/* ---------- "/" command menu ---------- */
const SLASH=[
 {c:'mission',a:'<text>',d:'sl_mission',i:'rocket',fill:true},{c:'spawn',a:'name: mission',d:'sl_spawn',i:'plus',fill:true},
 {c:'pause',a:'<agent|all>',d:'sl_pause',i:'pause',ag:true},{c:'resume',a:'<agent|all>',d:'sl_resume',i:'play',ag:true},
 {c:'stop',a:'<agent|all>',d:'sl_stop',i:'stop',ag:true},{c:'delete',a:'<agent>',d:'sl_delete',i:'trash',ag:true},
 {c:'list',d:'sl_list',i:'list'},{c:'usage',d:'sl_usage',i:'gauge'},{c:'clear done',d:'sl_clear',i:'check'},{c:'help',d:'sl_help',i:'book'},
 {c:'browser',d:'sl_browser',i:'win',ui:()=>go('browser')},{c:'new',d:'sl_new',i:'target',ui:()=>openMission()},
 {c:'connectors',d:'sl_connectors',i:'plug',ui:()=>go('connectors')},{c:'settings',d:'sl_settings',i:'wrench',ui:()=>go('settings')},
 {c:'theme',d:'sl_theme',i:'palette',ui:()=>saveCfg({theme:document.documentElement.dataset.theme==='light'?'dark':'light'},false)}];
let SL={el:null,items:[],sel:0};
function slashItems(v){
  const m=v.match(/^\/(pause|resume|stop|delete)\s+(\S*)$/i);
  if(m){const q=m[2].toLowerCase(),verb=m[1].toLowerCase();const out=[];if(verb!=='delete'&&'all'.startsWith(q))out.push({label:`/${verb} all`,hint:t('sl_all'),icon:'grid',val:`/${verb} all`,run:true});
    (S?S.agents:[]).filter(a=>a.name.startsWith(q)&&(verb==='delete'?a.status==='stopped':verb==='resume'?['paused','error'].includes(a.status):!['stopped','done'].includes(a.status))).forEach(a=>out.push({label:`/${verb} ${a.name}`,hint:t('s_'+a.status),bot:a,val:`/${verb} ${a.name}`,run:true}));return out}
  const am=v.match(/^@(\S*)$/);if(am)return (S?S.agents:[]).filter(a=>a.name.startsWith(am[1].toLowerCase())).map(a=>({label:'@'+a.name,hint:t('sl_msg'),bot:a,val:'@'+a.name+' ',run:false}));
  const q=v.slice(1).toLowerCase();if(!v.startsWith('/')||q.includes(' '))return [];
  return SLASH.filter(x=>x.c.startsWith(q)||t(x.d).toLowerCase().includes(q)).map(x=>({label:'/'+x.c,arg:x.a||'',hint:t(x.d),icon:x.i,val:'/'+x.c+(x.a?' ':''),run:!x.a,ui:x.ui}))}
function slashShow(el){const v=el.value;const items=slashItems(v);const box=$('slash');
  if(!items.length){slashHide();return}SL.el=el;if(SL.items.map(x=>x.label).join()!==items.map(x=>x.label).join())SL.sel=0;SL.items=items;
  box.innerHTML=`<div class="sh">${v.startsWith('@')?t('sl_msg'):t('p_cmds')}</div>`+items.map((x,i)=>`<div class="si ${i===SL.sel?'on':''}" data-si="${i}">${x.bot?bot(x.bot):ic(x.icon||'zap')}<code>${esc(x.label)}</code>${x.arg?`<em>${esc(x.arg)}</em>`:''}<small>${esc(x.hint)}</small></div>`).join('');
  box.querySelectorAll('[data-si]').forEach(d=>d.onmousedown=ev=>{ev.preventDefault();SL.sel=+d.dataset.si;slashPick(false)});
  box.classList.add('show');const r=el.getBoundingClientRect(),h=box.offsetHeight;
  box.style.left=Math.min(r.left,innerWidth-370)+'px';box.style.top=(r.top-h-8>8?r.top-h-8:r.bottom+8)+'px';
  const on=box.querySelector('.si.on');if(on)on.scrollIntoView({block:'nearest'})}
function slashHide(){$('slash').classList.remove('show');SL.items=[];SL.el=null}
async function slashPick(complete){const it=SL.items[SL.sel],el=SL.el;if(!it||!el)return;
  if(it.ui){el.value='';slashHide();if(el.id==='palIn')hide('palette');it.ui();return}
  if(complete||!it.run){el.value=it.val;el.focus();slashShow(el);return}
  el.value='';slashHide();if(el.id==='palIn')hide('palette');termHist.push(it.val);termPos=termHist.length;await cmd(it.val)}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.term||el.id==='palIn'){if(/^[\/@]/.test(el.value))slashShow(el);else slashHide()}});
document.addEventListener('keydown',e=>{if(!SL.el||e.target!==SL.el||!$('slash').classList.contains('show'))return;
  if(e.key==='ArrowDown'){SL.sel=(SL.sel+1)%SL.items.length;slashShow(SL.el)}else if(e.key==='ArrowUp'){SL.sel=(SL.sel-1+SL.items.length)%SL.items.length;slashShow(SL.el)}
  else if(e.key==='Tab'){slashPick(true)}else if(e.key==='Enter'){const it=SL.items[SL.sel];const typed=SL.el.value.trim();if(it&&(typed===it.val.trim()||!typed.includes(' ')||it.run))slashPick(false);else return}
  else if(e.key==='Escape'){slashHide()}else return;e.preventDefault();e.stopImmediatePropagation()},true);
document.addEventListener('focusout',e=>{if(e.target===SL.el)setTimeout(slashHide,120)});

applyI18n();go('home');
refresh().then(()=>{const h=location.hash;const v=h.match(/view=(\w+)/);if(v)go(v[1]);const m=h.match(/agent=(\w+)/);if(m)openDrawer(m[1]);const lk=h.match(/look=(\w+)-(\w+)/);if(lk)setLook(lk[1],lk[2]);if(h.includes('palette'))openPalette('list my github repos');if(h.includes('edit'))toggleEdit();if(h.includes('addw'))openAddWidget();if(h.includes('slash')){const i=document.querySelector('[data-term]');if(i){i.focus();i.value='/';slashShow(i)}}if(h.includes('slpause')){const i=document.querySelector('[data-term]');if(i){i.focus();i.value='/pause ';slashShow(i)}}});
setInterval(refresh,1500);
</script>
