name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test
        run: go vet ./... && go test ./...
      - name: Decide version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release is made for a v* tag, or when main.go has a version that has no release yet.
          V=$(grep -oP 'var version = "\K[^"]+' main.go)
          REL=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; REL=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" = "main" ] && ! gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then REL=true
          else V="$V-dev+${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release=$REL" >> "$GITHUB_OUTPUT"
      - name: Build AgentHQ.exe
        run: |
          V="${{ steps.ver.outputs.version }}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w -X main.version=$V" -o AgentHQ.exe .
          zip AgentHQ-windows.zip AgentHQ.exe
          sha256sum AgentHQ-windows.zip > AgentHQ-windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHQ-windows
          path: |
            AgentHQ-windows.zip
            AgentHQ-windows.zip.sha256
      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Agent HQ ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            AgentHQ-windows.zip
            AgentHQ-windows.zip.sha256
